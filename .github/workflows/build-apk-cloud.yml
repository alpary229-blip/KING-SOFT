name: Build Ahmed Al-Sharif Smart Pro Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17 for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies & Capacitor Android
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android Project
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Assemble Ready Android APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload Ready APK Artifact (ahmed-alsharif-smart-pro.apk)
        uses: actions/upload-artifact@v4
        with:
          name: ahmed-alsharif-smart-pro-apk
          path: android/app/build/outputs/apk/debug/*.apk
